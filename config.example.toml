[daemon]
pid_file = "gugu.pid"
log_dir = "logs"              # 进程日志与操作审计 audit.jsonl 都落在这里

# 本机在节点表里的显示名 (可选，缺省用主机名)。只影响展示，节点标识始终是 local。
# node_name = "中心机"

# API Key 认证 (可选，设置后所有 API 和 WebSocket 请求需要携带此 Key)
# api_key = "your-secret-key"

# 异常通知 (可选)：退出后不再拉起 / 健康判定不健康 / 被自动拉起 / 内存超限
# webhook_url = "https://oapi.dingtalk.com/robot/send?access_token=xxx"
# webhook_format = "dingtalk"   # dingtalk(钉钉/企微) | feishu | raw(原样事件 JSON)

# cgroup v2 硬限的落地目录 (仅 Linux；默认 /sys/fs/cgroup)。
# 容器或 systemd 委派环境里指向自己有写权限的子树。
# cgroup_root = "/sys/fs/cgroup"

[daemon.web]
addr = "0.0.0.0"
port = 9090
# CORS 允许的来源 (可选，为空则允许所有)
# cors_origins = ["http://localhost:3000"]
# WebUI 内置终端 (默认关闭)。开启后浏览器里是一个真实 shell，
# 监听非回环地址时必须同时配置 daemon.api_key，否则守护进程拒绝启动。
# terminal = false

# 多节点 (可选)：在中心节点声明其他机器，WebUI 顶栏切换后可直接启停进程、
# 看日志、改配置，实时状态与日志也随之跟随所选节点。
# 从节点只需正常跑 gugu，不需要任何额外配置；指向非回环地址时必须填 api_key
# (中心节点用它访问从节点)，否则中心节点拒绝启动。
# [[nodes]]
# name = "web1"                 # 节点标识，用作 --node 参数，只能用字母/数字/._-，不能是 . 或 ..
# label = "上海 Web"            # 界面显示名，可省略
# url = "http://10.0.0.12:9090"
# api_key = "从节点的 daemon.api_key"

# 示例进程配置
# 注意：其中的相对路径 (logs/、工作目录) 都相对于本配置文件所在目录，
# 把程序和配置放在哪里，日志就生成在哪里，整体可随身携带 (绿色部署)。
[processes.example-web]
command = "python"
args = ["-m", "http.server", "8080"]
auto_start = false            # 试跑示例时改为 true
auto_restart = true
max_restarts = 3
restart_delay_secs = 5
# restart_reset_secs = 60   # 稳定运行达该秒数后崩溃计数归零 (默认 60，守护长期有效)
# shell = false             # true 时 command/args 拼接后经 shell 执行 (支持管道等)
# max_memory_mb = 512       # 进程树内存超限则自动重启 (防内存泄漏)
# 资源硬限 (Linux 走 cgroup v2，需 root 或已委派的 cgroup 目录；Windows 走 Job Object)：
# cpu_max = "50%"           # 占单核 50%；也可写 0.5 (核数) 或 "50000 100000"。Windows 上按整机占比节流
# memory_max = "512M"       # Linux 越界整组 OOM，Windows 限制 Job 提交内存 — 这是硬限，不是上面的「超限重启」
# pids_max = "128"          # 进程/任务数上限，防 fork 炸弹。Windows 只统计进程
# stop_command = "kill $(lsof -t -i:8080)"  # 自定义停止命令 (可选，留空则使用默认信号终止)
max_log_size_mb = 10
stdout_log = "logs/example-web-stdout.log"
stderr_log = "logs/example-web-stderr.log"
# log_format = "auto"        # 日志行结构化格式：auto 逐行识别 JSON → logfmt → 文本；
#                            # 也可写死 json / logfmt / text，级别徽标与字段胶囊据此提取
# encoding = "auto"          # 日志文本编码：auto 先按 UTF-8 严格解码、失败回落 GBK (代码页 936)；
#                            # 中文 Windows 的 ping / cmd / Python 输出用 auto 即可正常显示；
#                            # 也可写死 utf-8 / gbk。只影响面板、广播与检索，日志文件始终存原始字节

# 监听端口：启动前检查占用、运行中统计连接数、作为依赖时判断是否就绪
listen_ports = [8080]
# port_check = true          # 启动前端口已被别人占用则直接失败并报出占用者 (默认 true)
# ready_timeout_secs = 60    # 下游等待本进程就绪的上限 (默认 60)

# 日志告警：关键字命中或短时间输出刷屏时推送通知 (需要 daemon.webhook_url)
# [processes.example-web.log_alert]
# patterns = ["error", "panic", "exception"]  # 小写子串匹配，命中任一即告警
# window_secs = 10           # 刷屏统计窗口
# burst_lines = 200          # 窗口内行数达到该值即告警，0 表示不启用刷屏检测
# cooldown_secs = 300        # 同类告警静默时长，防止重试风暴刷屏

[processes.example-web.health_check]
type = "tcp"
host = "127.0.0.1"  # 可选，默认 127.0.0.1
port = 8080
interval_secs = 10
timeout_secs = 3
# fail_threshold = 3  # 连续失败该次数才判定不健康 (默认 3，防止瞬时抖动误伤)

# unhealthy_restart = true  # 健康检查失败时自动重启

[processes.example-echo]
command = "ping"
args = ["127.0.0.1"]
auto_start = false
auto_restart = false
stdout_log = "logs/example-echo-stdout.log"

# depends_on = ["example-web"]  # 等 example-web 的端口进入监听后再启动
