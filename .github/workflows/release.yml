name: Release

# 打 v* 标签即发布绿色包：单个可执行文件 + 示例配置 + 许可与说明。
# 配置、PID、日志都会在首次运行时生成在程序同目录（绿色部署），
# 所以压缩包里不需要任何运行期文件。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: gugu-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: gugu-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存构建产物
        uses: Swatinem/rust-cache@v2

      - name: 构建 release 二进制
        run: cargo build --release --bin gugu --target ${{ matrix.target }}

      - name: 打包 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "stage/gugu"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/gugu.exe" $stage
          Copy-Item LICENSE, README.md, config.example.toml $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.asset }}"

      - name: 打包 (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p stage/gugu
          cp "target/${{ matrix.target }}/release/gugu" stage/gugu/
          cp LICENSE README.md config.example.toml stage/gugu/
          tar -czf "${{ matrix.asset }}" -C stage gugu

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: 发布到 GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 汇总产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release 并附上绿色包
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
